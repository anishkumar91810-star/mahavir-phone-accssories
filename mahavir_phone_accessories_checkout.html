<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahavir Phone Accessories - Checkout</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#171717}
.app{max-width:430px;margin:auto;min-height:100vh;background:#fff;padding-bottom:90px}
header{background:#111;color:#fff;padding:17px 16px}.top{display:flex;align-items:center;gap:13px}.back{font-size:26px}.brand{font-weight:800;font-size:18px}.sub{font-size:11px;color:#ffd400}
h2{font-size:20px;margin:20px 16px 12px}.box{margin:0 14px 12px;padding:15px;border:1px solid #e6e6e6;border-radius:14px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:14px}textarea{height:72px;resize:none}
.payment{display:flex;gap:10px}.pay{flex:1;border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center;font-size:12px}.pay.active{border:2px solid #ffd400;background:#fffbea}
.row{display:flex;justify-content:space-between;margin:9px 0;font-size:14px}.total{font-size:18px;font-weight:800;border-top:1px solid #ddd;padding-top:12px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#fff;border-top:1px solid #ddd;padding:12px 14px}.btn{width:100%;padding:14px;background:#ffd400;border:0;border-radius:11px;font-size:16px;font-weight:800}
</style></head>
<body><div class="app">
<header><div class="top"><span class="back">‹</span><div><div class="brand">MAHAVIR PHONE ACCESSORIES</div><div class="sub">सुरक्षित और आसान ऑर्डर</div></div></div></header>

<h2>📦 Checkout</h2>
<div class="box">
<b>डिलीवरी की जानकारी</b>
<label>पूरा नाम</label><input placeholder="अपना नाम लिखें">
<label>मोबाइल नंबर</label><input type="tel" placeholder="10 अंकों का मोबाइल नंबर">
<label>पूरा पता</label><textarea placeholder="घर/दुकान नंबर, मोहल्ला, सड़क"></textarea>
<label>शहर</label><input placeholder="शहर">
<label>पिन कोड</label><input inputmode="numeric" placeholder="6 अंकों का पिन कोड">
</div>

<div class="box">
<b>💳 Payment Method</b>
<div class="payment" style="margin-top:12px">
<div class="pay active">💵<br><b>Cash on Delivery</b></div>
<div class="pay">💳<br><b>Online Payment</b></div>
</div>
</div>

<div class="box">
<b>ऑर्डर सारांश</b>
<div class="row"><span>प्रोडक्ट</span><span>₹698</span></div>
<div class="row"><span>डिलीवरी</span><span>FREE</span></div>
<div class="row total"><span>कुल भुगतान</span><span>₹698</span></div>
</div>

<div class="bottom"><button class="btn">✓ Order Place करें — ₹698</button></div>
</div></body></html>
