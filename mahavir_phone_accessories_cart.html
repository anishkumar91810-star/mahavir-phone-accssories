<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahavir Phone Accessories - Cart</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#171717}
.app{max-width:430px;margin:auto;min-height:100vh;background:#fff;padding-bottom:95px}
header{background:#111;color:#fff;padding:17px 16px}.top{display:flex;align-items:center;gap:14px}.back{font-size:25px}.brand{font-weight:800;font-size:18px}.sub{font-size:11px;color:#ffd400}
h2{font-size:21px;margin:20px 16px 12px}.cart{padding:0 14px}
.item{display:flex;gap:12px;padding:12px;border:1px solid #e7e7e7;border-radius:14px;margin-bottom:10px}
.pic{width:78px;height:78px;background:#f1f1f1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:35px}
.info{flex:1}.name{font-weight:700;font-size:14px;margin:2px 0 6px}.price{font-weight:800}.muted{font-size:11px;color:#777}
.controls{display:flex;align-items:center;gap:8px;margin-top:8px}.qty{border:1px solid #ddd;border-radius:8px;padding:4px 9px;background:#fff}.remove{margin-left:auto;border:0;background:none;font-size:18px;color:#777}
.box{margin:14px;border-radius:14px;background:#fafafa;border:1px solid #eee;padding:15px}.row{display:flex;justify-content:space-between;margin:9px 0;font-size:14px}.total{font-size:18px;font-weight:800;border-top:1px solid #ddd;padding-top:12px}
.coupon{display:flex;gap:8px;margin-top:12px}.coupon input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px}.apply{background:#111;color:#fff;border:0;border-radius:9px;padding:0 14px}
.checkout{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#fff;border-top:1px solid #ddd;padding:12px 14px;display:flex;align-items:center;gap:12px}.checkout .sum{flex:1}.checkout b{display:block;font-size:18px}.btn{width:170px;background:#ffd400;border:0;border-radius:11px;padding:13px;font-weight:800;font-size:15px}
</style></head>
<body><div class="app">
<header><div class="top"><span class="back">‹</span><div><div class="brand">MAHAVIR PHONE ACCESSORIES</div><div class="sub">मोबाइल की हर एक्सेसरी, एक ही जगह।</div></div></div></header>
<h2>🛒 आपका कार्ट (2)</h2>
<div class="cart">
<div class="item"><div class="pic">📱</div><div class="info"><div class="name">Silicone Back Cover</div><div class="muted">Black • 1 पीस</div><div class="price">₹199</div><div class="controls"><button class="qty">−</button><b>1</b><button class="qty">＋</button><button class="remove">🗑️</button></div></div></div>
<div class="item"><div class="pic">🔌</div><div class="info"><div class="name">Fast Charger 25W</div><div class="muted">White • 1 पीस</div><div class="price">₹499</div><div class="controls"><button class="qty">−</button><b>1</b><button class="qty">＋</button><button class="remove">🗑️</button></div></div></div>
</div>
<div class="box"><b>कूपन कोड</b><div class="coupon"><input placeholder="कूपन डालें"><button class="apply">लागू करें</button></div></div>
<div class="box"><b>ऑर्डर सारांश</b><div class="row"><span>प्रोडक्ट कीमत</span><span>₹698</span></div><div class="row"><span>डिलीवरी</span><span>FREE</span></div><div class="row total"><span>कुल राशि</span><span>₹698</span></div></div>
<div class="checkout"><div class="sum"><span class="muted">कुल भुगतान</span><b>₹698</b></div><button class="btn">Checkout →</button></div>
</div></body></html>
