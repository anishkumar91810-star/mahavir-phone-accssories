<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mahavir Phone Accessories - Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#202124}.top{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:21px}.top small{color:#ffd400}.wrap{max-width:1200px;margin:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px #00000012}.stat b{font-size:27px;display:block;margin-top:8px}.nav{display:flex;gap:8px;overflow:auto;margin:20px 0}.nav button,.btn{border:0;border-radius:9px;padding:11px 15px;background:#111;color:white;cursor:pointer}.nav button.active,.btn.yellow{background:#ffd400;color:#111}.section{display:none}.section.active{display:block}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.search{padding:11px;border:1px solid #ddd;border-radius:9px;width:250px}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.badge{padding:5px 8px;border-radius:20px;background:#eee;font-size:12px}.low{background:#ffe1e1;color:#b40000}.ok{background:#dcfce7;color:#16733a}.actions button{margin-right:5px;padding:7px 9px;border:0;border-radius:7px;cursor:pointer}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:500px;border-radius:16px;padding:22px}.box input,.box select{width:100%;padding:11px;margin:7px 0 12px;border:1px solid #ddd;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.order{margin-bottom:12px}.order-head{display:flex;justify-content:space-between;gap:10px}.status select{padding:8px;border-radius:8px;border:1px solid #ddd}.empty{text-align:center;padding:35px;color:#777}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.table{font-size:12px}.table th:nth-child(3),.table td:nth-child(3){display:none}.search{width:150px}.row{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head>
<body>
<header class="top"><div><h1>🛍️ Mahavir Phone Accessories</h1><small>Admin Panel</small></div><button class="btn yellow" onclick="resetDemo()">Demo Reset</button></header>
<main class="wrap">
<div class="stats"><div class="card stat">📦 Products<b id="sProducts">0</b></div><div class="card stat">🛒 Orders<b id="sOrders">0</b></div><div class="card stat">💰 Sales<b id="sSales">₹0</b></div><div class="card stat">⚠️ Low Stock<b id="sLow">0</b></div></div>
<nav class="nav"><button class="active" onclick="show('dashboard',this)">Dashboard</button><button onclick="show('products',this)">Products & Stock</button><button onclick="show('orders',this)">Orders</button></nav>
<section id="dashboard" class="section active"><div class="card"><h2>Quick Actions</h2><button class="btn yellow" onclick="openProduct()">+ Add Product</button> <button class="btn" onclick="show('orders',document.querySelectorAll('.nav button')[2])">View Orders</button></div><br><div class="card"><h2>Recent Orders</h2><div id="recent"></div></div></section>
<section id="products" class="section"><div class="bar"><h2>Products & Stock</h2><div><input class="search" id="psearch" placeholder="Search product..." oninput="renderProducts()"> <button class="btn yellow" onclick="openProduct()">+ Add Product</button></div></div><div class="card"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody id="productsBody"></tbody></table></div></section>
<section id="orders" class="section"><div class="bar"><h2>Orders</h2><input class="search" id="osearch" placeholder="Order ID / customer" oninput="renderOrders()"></div><div id="ordersList"></div></section>
</main>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Add Product</h2><div class="row"><div><label>Product Name</label><input id="pn"></div><div><label>Category</label><input id="pc"></div></div><div class="row"><div><label>Price (₹)</label><input id="pp" type="number"></div><div><label>Stock</label><input id="ps" type="number"></div></div><div><label>Image URL (optional)</label><input id="pi"></div><button class="btn yellow" onclick="saveProduct()">Save</button> <button class="btn" onclick="closeModal()">Cancel</button></div></div>
<script>
const seedProducts=[{id:1,name:'Premium Mobile Cover',cat:'Covers',price:299,stock:18,img:''},{id:2,name:'25W Fast Charger',cat:'Chargers',price:599,stock:7,img:''},{id:3,name:'Type-C Cable',cat:'Cables',price:199,stock:32,img:''},{id:4,name:'Wireless Earbuds',cat:'Earphones',price:899,stock:4,img:''}];
const seedOrders=[{id:'MPA1001',customer:'Rahul Kumar',phone:'98XXXXXX21',items:'Premium Mobile Cover × 2',total:598,status:'Confirmed'},{id:'MPA1002',customer:'Amit Singh',phone:'97XXXXXX55',items:'25W Fast Charger × 1',total:599,status:'Shipped'},{id:'MPA1003',customer:'Priya',phone:'99XXXXXX10',items:'Wireless Earbuds × 1',total:899,status:'Delivered'}];
let products=JSON.parse(localStorage.getItem('mpa_products')||'null')||seedProducts;let orders=JSON.parse(localStorage.getItem('mpa_orders')||'null')||seedOrders;let editId=null;
function persist(){localStorage.setItem('mpa_products',JSON.stringify(products));localStorage.setItem('mpa_orders',JSON.stringify(orders));}
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}
function updateStats(){document.getElementById('sProducts').textContent=products.length;document.getElementById('sOrders').textContent=orders.length;document.getElementById('sSales').textContent=money(orders.reduce((a,o)=>a+Number(o.total),0));document.getElementById('sLow').textContent=products.filter(p=>p.stock<10).length}
function renderProducts(){let q=(document.getElementById('psearch')?.value||'').toLowerCase();let rows=products.filter(p=>(p.name+' '+p.cat).toLowerCase().includes(q));document.getElementById('productsBody').innerHTML=rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.cat)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><span class="badge ${p.stock<10?'low':'ok'}">${p.stock<10?'Low Stock':'In Stock'}</span></td><td class="actions"><button onclick="openProduct(${p.id})">✏️ Edit</button><button onclick="delProduct(${p.id})">🗑️</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No products found</td></tr>'}
function renderOrders(){let q=(document.getElementById('osearch')?.value||'').toLowerCase();let list=orders.filter(o=>(o.id+' '+o.customer).toLowerCase().includes(q));document.getElementById('ordersList').innerHTML=list.map(o=>`<div class="card order"><div class="order-head"><div><b>${o.id}</b><br>${esc(o.customer)} · ${esc(o.phone)}<br><small>${esc(o.items)}</small></div><div><b>${money(o.total)}</b><div class="status"><select onchange="setStatus('${o.id}',this.value)">${['Confirmed','Packed','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div></div></div>`).join('')||'<div class="card empty">No orders found</div>'}
function renderRecent(){document.getElementById('recent').innerHTML=orders.slice(0,5).map(o=>`<p><b>${o.id}</b> — ${esc(o.customer)} — ${money(o.total)} <span class="badge">${o.status}</span></p>`).join('')}
function openProduct(id){editId=id||null;let p=products.find(x=>x.id===id);document.getElementById('modalTitle').textContent=p?'Edit Product':'Add Product';document.getElementById('pn').value=p?.name||'';document.getElementById('pc').value=p?.cat||'';document.getElementById('pp').value=p?.price||'';document.getElementById('ps').value=p?.stock??'';document.getElementById('pi').value=p?.img||'';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveProduct(){let name=pn.value.trim(),cat=pc.value.trim(),price=Number(pp.value),stock=Number(ps.value),img=pi.value.trim();if(!name||!cat||price<0||stock<0)return alert('कृपया सभी जानकारी सही भरें।');if(editId){let p=products.find(x=>x.id===editId);Object.assign(p,{name,cat,price,stock,img})}else products.push({id:Date.now(),name,cat,price,stock,img});persist();closeModal();renderAll()}
function delProduct(id){if(confirm('इस product को delete करें?')){products=products.filter(p=>p.id!==id);persist();renderAll()}}
function setStatus(id,status){let o=orders.find(x=>x.id===id);if(o){o.status=status;persist();renderAll()}}
function show(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderAll()}
function resetDemo(){if(confirm('Demo data reset करें?')){localStorage.removeItem('mpa_products');localStorage.removeItem('mpa_orders');products=JSON.parse(JSON.stringify(seedProducts));orders=JSON.parse(JSON.stringify(seedOrders));renderAll()}}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderAll(){updateStats();renderProducts();renderOrders();renderRecent()};renderAll();
</script></body></html>
